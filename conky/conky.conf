conky.config = {
    -- Configurações da janela
    alignment = 'top_right',
    background = true,
    double_buffer = true,
    update_interval = 2.0,
    minimum_width = 330,
    minimum_height = 650,
    gap_x = 20,
    gap_y = 40,

    -- Aparência da janela
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'normal',
    own_window_argb_visual = true,
    own_window_argb_value = 180,
    own_window_transparent = true,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    -- Tipografia e cores
    use_xft = true,
    font = 'DejaVu Sans Mono:size=9',
    xftalpha = 0.9,
    default_color = 'white',
    color1 = '#4CA6FF',
    color2 = '#B0B0B0',
    color3 = '#FFB86C',

    -- Otimizações e formatação
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    no_buffers = true,
    short_units = true,
    pad_percents = 2,
};

conky.text = [[
${color1}${time %A, %d/%m/%Y}${alignr}${time %H:%M:%S}${color}
${color1}${hr 1}${color}
${color1}SISTEMA${color}
SO / Kernel:     ${color2}$sysname $kernel ($machine)${color}
Data Instalação: ${color2}${execi 86400 date -d "$(stat -c %w / 2>/dev/null | cut -d. -f1)" "+%d/%m/%Y %H:%M" 2>/dev/null || stat -c %z / 2>/dev/null | cut -d' ' -f1}${color}
Tempo Online:    ${color2}$uptime${color}

${color1}PROCESSADOR (CPU)${color}
Modelo:   ${color2}${execi 86400 grep -m1 "model name" /proc/cpuinfo | cut -d: -f2 | sed "s/^[ \t]*//"}${color}
Perfil:   ${color2}${execi 10 powerprofilesctl get 2>/dev/null || cat /sys/devices/system/cpu/cpu0/cpufreq/energy_performance_preference 2>/dev/null || cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor 2>/dev/null}${color} ${alignr}${color1}Temp:${color} ${color3}${hwmon coretemp temp 1}°C${color}
Uso CPU:  ${color2}$cpu% @ ${freq_g}GHz${color} ${alignr}${color1}Carga:${color} ${color2}$loadavg${color}
${cpubar 7}
Proc:     ${color2}$processes ($running_processes ativos)${color} ${alignr}${color1}Threads:${color} ${color2}$threads${color}
${color2}Cores 1-4:   ${cpu cpu1}%  ${cpu cpu2}%  ${cpu cpu3}%  ${cpu cpu4}%
Cores 5-8:   ${cpu cpu5}%  ${cpu cpu6}%  ${cpu cpu7}%  ${cpu cpu8}%
Cores 9-12:  ${cpu cpu9}%  ${cpu cpu10}%  ${cpu cpu11}%  ${cpu cpu12}%${color}

${color1}PLACA DE VÍDEO (GPU)${color}
Modelo:   ${color2}${execi 60 nvidia-smi --query-gpu=name --format=csv,noheader 2>/dev/null || echo "NVIDIA GPU Offline"}${color}
Perfil:   ${color2}${exec nvidia-smi --query-gpu=pstate --format=csv,noheader,nounits 2>/dev/null || echo "N/A"}${color} ${alignr}${color1}Temp:${color} ${color3}${exec nvidia-smi --query-gpu=temperature.gpu --format=csv,noheader,nounits 2>/dev/null || echo 0}°C${color}
Uso GPU:  ${color2}${exec nvidia-smi --query-gpu=utilization.gpu --format=csv,noheader,nounits 2>/dev/null || echo 0}%${color} ${alignr}${color1}Consumo:${color} ${color2}${exec nvidia-smi --query-gpu=power.draw --format=csv,noheader 2>/dev/null || echo 0}${color}
VRAM:     ${color2}${exec nvidia-smi --query-gpu=memory.used --format=csv,noheader 2>/dev/null || echo 0} / ${exec nvidia-smi --query-gpu=memory.total --format=csv,noheader 2>/dev/null || echo 0}${color}
Clocks:   ${color2}${exec nvidia-smi --query-gpu=clocks.gr --format=csv,noheader 2>/dev/null || echo 0} / ${exec nvidia-smi --query-gpu=clocks.mem --format=csv,noheader 2>/dev/null || echo 0}${color}

${color1}MEMÓRIA${color}
RAM:  ${color2}$mem / $memmax ($memperc%)${color} ${membar 7}
Swap: ${color2}$swap / $swapmax ($swapperc%)${color} ${swapbar 7}

${color1}ARMAZENAMENTO${color}
Raiz (/):      ${color2}${fs_used /} / ${fs_size /} (${fs_free_perc /}% livre)${color}
${fs_bar 7 /}
Arquivos:      ${color2}${fs_used /media/Arquivos} / ${fs_size /media/Arquivos} (${fs_free_perc /media/Arquivos}% livre)${color}
${fs_bar 7 /media/Arquivos}

${color1}REDE${color}
Ethernet (enp44s0):
  Down: ${color2}${downspeed enp44s0}${color} ${alignr}Up: ${color2}${upspeed enp44s0}${color}
  Total: ${color2}${totaldown enp44s0}${color} ${alignr}Total: ${color2}${totalup enp44s0}${color}
Wi-Fi (wlp0s20f3):
  Down: ${color2}${downspeed wlp0s20f3}${color} ${alignr}Up: ${color2}${upspeed wlp0s20f3}${color}
  Total: ${color2}${totaldown wlp0s20f3}${color} ${alignr}Total: ${color2}${totalup wlp0s20f3}${color}

${color1}TOP PROCESSOS${color}
${color2}${top name 1} ${alignr}${top cpu 1}% | ${top_mem name 1} ${alignr}${top_mem mem_res 1}
${top name 2} ${alignr}${top cpu 2}% | ${top_mem name 2} ${alignr}${top_mem mem_res 2}
${top name 3} ${alignr}${top cpu 3}% | ${top_mem name 3} ${alignr}${top_mem mem_res 3}
${top name 4} ${alignr}${top cpu 4}% | ${top_mem name 4} ${alignr}${top_mem mem_res 4}
${top name 5} ${alignr}${top cpu 5}% | ${top_mem name 5} ${alignr}${top_mem mem_res 5}${color}
]];
