conky.config = {
    -- Window settings
    alignment = 'top_right',
    background = true,
    double_buffer = true,
    update_interval = 2.0,  -- Update every 2 seconds
    minimum_width = 300, minimum_height = 600,

    -- Window appearance
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'normal',
    own_window_argb_visual = true,
    own_window_argb_value = 150,  -- Transparency
    own_window_transparent = true,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    -- Fonts and colors
    use_xft = true,
    font = 'DejaVu Sans Mono:size=10',
    xftalpha = 0.8,
    default_color = 'white',
    color1 = 'white',
    color2 = 'grey',

    -- Performance tweaks
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    no_buffers = true,
    short_units = true,
    pad_percents = 2,
};

conky.text = [[
# Date and time
${color1}${time %A %d %B %Y} ${alignr}${time %H:%M:%S}

# CPU usage
${color1}CPU Usage:${color} ${cpu}% ${cpubar 10}

# CPU temperature (using sensors command)
${color1}CPU Temp:${color} ${exec sensors | grep 'Package id 0:' | awk '{print $4}'}

# RAM usage
${color1}RAM Usage:${color} $mem / $memmax ($memperc%) ${membar 10}

# Disk usage (root partition)
${color1}Disk Usage /:${color} ${fs_used /} / ${fs_size /} (${fs_free_perc /}% free) ${fs_bar 10 /}

# Network info (Ethernet interface enp44s0)
${color1}Network (Ethernet - enp44s0):${color}
Download: ${downspeed enp44s0} KiB/s ${alignr}Upload: ${upspeed enp44s0} KiB/s
Total Download: ${totaldown enp44s0} ${alignr}Total Upload: ${totalup enp44s0}

# Network info (Wi-Fi interface wlp0s20f3)
${color1}Network (Wi-Fi - wlp0s20f3):${color}
Download: ${downspeed wlp0s20f3} KiB/s ${alignr}Upload: ${upspeed wlp0s20f3} KiB/s
Total Download: ${totaldown wlp0s20f3} ${alignr}Total Upload: ${totalup wlp0s20f3}

# Top 7 processes by Memory usage
${color1}Top 7 Processes by Memory:
${color2}${top_mem name 1} ${top_mem mem_res 1} MiB
${color2}${top_mem name 2} ${top_mem mem_res 2} MiB
${color2}${top_mem name 3} ${top_mem mem_res 3} MiB
${color2}${top_mem name 4} ${top_mem mem_res 4} MiB
${color2}${top_mem name 5} ${top_mem mem_res 5} MiB
${color2}${top_mem name 6} ${top_mem mem_res 6} MiB
${color2}${top_mem name 7} ${top_mem mem_res 7} MiB

# Top 7 processes by CPU usage
${color1}Top 7 Processes by CPU:
${color2}${top name 1} ${top cpu 1}%
${color2}${top name 2} ${top cpu 2}%
${color2}${top name 3} ${top cpu 3}%
${color2}${top name 4} ${top cpu 4}%
${color2}${top name 5} ${top cpu 5}%
${color2}${top name 6} ${top cpu 6}%
${color2}${top name 7} ${top cpu 7}%

# GPU NVIDIA usage via nvidia-smi
${color1}GPU (NVIDIA RTX 3050):
${exec nvidia-smi --query-gpu=utilization.gpu,temperature.gpu,memory.used,memory.total --format=csv,noheader,nounits | awk -F',' '{printf("Usage: %s%%\\nTemp: %s °C\\nVRAM: %s MiB / %s MiB", $1, $2, $3, $4)}'}
]];
